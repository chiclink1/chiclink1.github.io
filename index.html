<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>DESKFIT 관리도구</title>
</head>
<body style="font-family:sans-serif;max-width:560px;margin:40px auto;padding:0 16px;line-height:1.6;color:#1F1F1F;background:#fff">
<h2>DESKFIT 관리도구</h2>
<p id="m">카페24 연결 전용 중계 페이지입니다. 이 페이지는 어떤 정보도 저장하거나 외부로 보내지 않습니다.</p>
<script>
// 카페24 인증 응답(code·state)을 이 PC의 연결 프로그램(127.0.0.1)으로만 넘긴다. 다른 곳으로는 보내지 않는다.
(function () {
  var q = location.search;
  if (/[?&](code|error)=/.test(q) && /[?&]state=[0-9a-f]{32}(&|$)/.test(q)) {
    document.getElementById('m').textContent = '이 PC의 연결 프로그램으로 넘기는 중입니다…';
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    location.replace('http://127.0.0.1:8445/callback' + q);
  }
})();
</script>
</body>
</html>
